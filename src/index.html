<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuMark</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Marked.js: Markdown → HTML -->
    <script src="vendor/marked.min.js"></script>
    <!-- Turndown: HTML → Markdown -->
    <script src="vendor/turndown.js"></script>
    <!-- Turndown GFM plugin: tables, strikethrough, task lists -->
    <script src="vendor/turndown-plugin-gfm.js"></script>
    <!-- Highlight.js: コードハイライト -->
    <link rel="stylesheet" href="vendor/atom-one-light.min.css">
    <script src="vendor/highlight.min.js"></script>
    <!-- Mermaid.js: 図表レンダリング (非同期読み込み) -->
    <script src="vendor/mermaid.min.js" defer></script>
    <!-- KaTeX: math rendering -->
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <script src="vendor/katex/katex.min.js"></script>
    <!-- DOMPurify: XSS prevention -->
    <script src="vendor/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Toolbar -->
        <div class="toolbar">
            <button id="newBtn" class="toolbar-btn" title="新規 (Cmd/Ctrl+N)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
            </button>
            <button id="openBtn" class="toolbar-btn" title="開く (Cmd/Ctrl+O)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 15v4c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <polyline points="16 3 21 3 21 8"/>
                    <line x1="21" y1="3" x2="10" y2="14"/>
                </svg>
            </button>
            <button id="saveBtn" class="toolbar-btn" title="保存 (Cmd/Ctrl+S)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                </svg>
            </button>
            <button id="saveAsBtn" class="toolbar-btn" title="名前を付けて保存 (Cmd/Ctrl+Shift+S)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                    <text x="12" y="18" text-anchor="middle" font-size="7" fill="currentColor" stroke="none" font-weight="bold">As</text>
                </svg>
            </button>
            <button id="pdfBtn" class="toolbar-btn" title="PDF出力 (Cmd/Ctrl+P)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 9V2h12v7"/>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                    <rect x="6" y="14" width="12" height="8"/>
                </svg>
            </button>
            <button id="undoBtn" class="toolbar-btn" title="元に戻す (Cmd/Ctrl+Z)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="1 4 1 10 7 10"/>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                </svg>
            </button>
            <button id="redoBtn" class="toolbar-btn" title="やり直し (Cmd/Ctrl+Shift+Z)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
            </button>
            <div class="toolbar-divider"></div>

            <button id="boldBtn" class="toolbar-btn" title="太字 (Cmd/Ctrl+B)">
                <strong>B</strong>
            </button>
            <button id="italicBtn" class="toolbar-btn" title="斜体 (Cmd/Ctrl+I)">
                <em>I</em>
            </button>
            <button id="strikeBtn" class="toolbar-btn" title="取り消し線 (Cmd/Ctrl+Shift+X)">
                <s>S</s>
            </button>
            <button id="codeBtn" class="toolbar-btn" title="インラインコード (Cmd/Ctrl+E)">
                <code>&lt;/&gt;</code>
            </button>
            <div class="toolbar-divider"></div>

            <button id="linkBtn" class="toolbar-btn" title="リンク (Cmd/Ctrl+K)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
            </button>
            <button id="imageBtn" class="toolbar-btn" title="画像">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </button>
            <button id="mermaidBtn" class="toolbar-btn" title="Mermaid挿入">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 18c2-4 8-4 10 0"/>
                    <circle cx="8" cy="8" r="2"/>
                    <circle cx="16" cy="8" r="2"/>
                </svg>
            </button>
            <div class="toolbar-divider"></div>

            <button id="h1Btn" class="toolbar-btn" title="見出し1">H1</button>
            <button id="h2Btn" class="toolbar-btn" title="見出し2">H2</button>
            <button id="h3Btn" class="toolbar-btn" title="見出し3">H3</button>
            <div class="toolbar-divider"></div>

            <button id="ulBtn" class="toolbar-btn" title="箇条書き">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6"/>
                    <line x1="3" y1="12" x2="3.01" y2="12"/>
                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
            </button>
            <button id="olBtn" class="toolbar-btn" title="番号付きリスト">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="10" y1="6" x2="21" y2="6"/>
                    <line x1="10" y1="12" x2="21" y2="12"/>
                    <line x1="10" y1="18" x2="21" y2="18"/>
                    <path d="M4 6h1v4"/>
                    <path d="M4 10h2"/>
                    <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>
                </svg>
            </button>
            <button id="taskBtn" class="toolbar-btn" title="タスクリスト">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 11 12 14 22 4"/>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg>
            </button>
            <div class="toolbar-divider"></div>

            <button id="tableBtn" class="toolbar-btn" title="テーブル">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="3" y1="15" x2="21" y2="15"/>
                    <line x1="12" y1="3" x2="12" y2="21"/>
                </svg>
            </button>
            <button id="codeBlockBtn" class="toolbar-btn" title="コードブロック">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6"/>
                    <polyline points="8 6 2 12 8 18"/>
                </svg>
            </button>
            <button id="quoteBtn" class="toolbar-btn" title="引用">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/>
                    <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/>
                </svg>
            </button>
            <button id="toggleBtn" class="toolbar-btn" title="トグル">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6"/>
                    <line x1="4" y1="21" x2="20" y2="21"/>
                    <line x1="4" y1="3" x2="20" y2="3"/>
                </svg>
            </button>
            <button id="hrBtn" class="toolbar-btn" title="水平線">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"/>
                </svg>
            </button>
            <div class="toolbar-divider"></div>

            <button id="dateBtn" class="toolbar-btn" title="日付を挿入 (Ctrl+;)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
            </button>
            <button id="timeBtn" class="toolbar-btn" title="時刻を挿入 (Ctrl+:)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
            </button>
            <button id="datetimeBtn" class="toolbar-btn" title="日時を挿入">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                    <circle cx="12" cy="15" r="3"/>
                </svg>
            </button>
            <div class="toolbar-divider"></div>

            <button id="tocBtn" class="toolbar-btn" title="目次（TOC）を挿入">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="3.01" y2="6"/>
                    <line x1="7" y1="6" x2="14" y2="6"/>
                    <line x1="5" y1="12" x2="5.01" y2="12"/>
                    <line x1="9" y1="12" x2="16" y2="12"/>
                    <line x1="5" y1="18" x2="5.01" y2="18"/>
                    <line x1="9" y1="18" x2="16" y2="18"/>
                </svg>
            </button>
            <button id="emojiBtn" class="toolbar-btn" title="絵文字">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                    <line x1="9" y1="9" x2="9.01" y2="9"/>
                    <line x1="15" y1="9" x2="15.01" y2="9"/>
                </svg>
            </button>
            <div class="spacer"></div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar" id="tabBar">
            <div class="tab-list" id="tabList"></div>
        </div>

        <!-- WYSIWYG Editor (contenteditable) -->
        <div class="editor-container">
            <div id="editor" class="markdown-body" contenteditable="true" spellcheck="true" data-placeholder="Markdownをここに入力してください..."></div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span id="currentFile" class="status-filepath" title="">無題</span>
            <span id="wordCount">0 文字 | 0 行</span>
        </div>
    </div>

    <!-- Modal Dialog -->
    <div id="modalOverlay" class="modal-overlay" style="display:none">
        <div class="modal-dialog">
            <div class="modal-title" id="modalTitle">入力</div>
            <div id="modalFields"></div>
            <div class="modal-buttons">
                <button id="modalCancel" class="modal-btn modal-btn-cancel">キャンセル</button>
                <button id="modalOk" class="modal-btn modal-btn-ok">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Debug: Check library loading
        window.addEventListener('DOMContentLoaded', function() {
            console.log('Libraries loaded:', {
                marked: typeof marked !== 'undefined',
                TurndownService: typeof TurndownService !== 'undefined',
                turndownPluginGfm: typeof turndownPluginGfm !== 'undefined',
                hljs: typeof hljs !== 'undefined',
                mermaid: typeof mermaid !== 'undefined',
                katex: typeof katex !== 'undefined'
            });
        });
    </script>
    <script src="utils.js"></script>
    <script src="nodeUtils.js"></script>
    <script src="main.js"></script>
</body>
</html>
