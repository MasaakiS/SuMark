[package]
name = "sumark"
version = "1.1.4"
description = "SuMark - A WYSIWYG Markdown editor"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["protocol-asset", "dialog-all", "fs-all", "shell-open", "app-all", "window-set-title", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
arboard = "3.4"
base64 = "0.22"
image = "0.25"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
wry = { path = "patches/wry-0.24.11" }
