name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            name: macOS
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux (x86_64)
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            name: Linux (ARM64)

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies (x86_64)
        if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            patchelf

      - name: Install ARM64 cross-compilation dependencies
        if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # Install base build tools
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

          # Add arm64 architecture
          sudo dpkg --add-architecture arm64

          # Properly configure apt sources for multiarch
          sudo bash -c 'cat > /etc/apt/sources.list << EOF
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF'

          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev:arm64 \
            libgtk-3-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 \
            libssl-dev:arm64 \
            libxdo-dev:arm64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Setup environment for ARM64 cross-compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=/" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          CHANGELOG=$(awk "/^## \[v${VERSION}\]/{found=1; next} /^## \[v/{if(found) exit} found" CHANGELOG.md)
          # Set as multiline output
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SuMark ${{ github.ref_name }}'
          releaseBody: |
            ## Changes

            ${{ steps.changelog.outputs.body }}

            ## Downloads

            ### Installer (recommended)
            | OS | File |
            |---|---|
            | macOS | `.dmg` |
            | Windows | `.msi` |
            | Linux / Chromebook (x86_64) | `.deb` |
            | Linux / Chromebook (ARM64) | `.deb` (arm64) |

            ### Portable (no install required)
            | OS | File |
            |---|---|
            | macOS | `SuMark-portable-macos-${{ github.ref_name }}.zip` |
            | Windows | `SuMark-portable-windows-${{ github.ref_name }}.zip` |
            | Linux / Chromebook (x86_64) | `SuMark-linux-${{ github.ref_name }}.AppImage` |
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '--target aarch64-unknown-linux-gnu --bundles deb' || format('--target {0}', matrix.target) }}

      # Create portable zip for macOS
      - name: Create portable zip (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          APP_PATH=$(find src-tauri/target -name "SuMark.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            ditto -c -k --sequesterRsrc "$APP_PATH" "SuMark-portable-macos-${{ github.ref_name }}.zip"
          fi

      - name: Upload portable zip (macOS)
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: SuMark-portable-macos-${{ github.ref_name }}.zip

      # Create portable zip for Windows
      - name: Create portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "SuMark.exe" | Where-Object { $_.DirectoryName -like "*release*" -and $_.DirectoryName -notlike "*deps*" } | Select-Object -First 1
          if ($exe) {
            Compress-Archive -Path $exe.FullName -DestinationPath "SuMark-portable-windows-${{ github.ref_name }}.zip"
          }

      - name: Upload portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: SuMark-portable-windows-${{ github.ref_name }}.zip

      # Upload AppImage for Linux
      - name: Upload AppImage (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          APPIMAGE=$(find src-tauri/target -name "*.AppImage" -type f | head -1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" "SuMark-linux-${{ github.ref_name }}.AppImage"
          fi

      - name: Upload AppImage artifact (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: SuMark-linux-${{ github.ref_name }}.AppImage
