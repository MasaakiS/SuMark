name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            name: macOS
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SuMark ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads

            ### Installer (recommended)
            | OS | File |
            |---|---|
            | macOS | `.dmg` |
            | Windows | `.msi` |

            ### Portable (no install required)
            | OS | File |
            |---|---|
            | macOS | `SuMark.app.zip` |
            | Windows | `SuMark-portable-windows.zip` |
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Create portable zip for macOS
      - name: Create portable zip (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          APP_PATH=$(find src-tauri/target -name "SuMark.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            ditto -c -k --sequesterRsrc "$APP_PATH" "SuMark-portable-macos.zip"
          fi

      - name: Upload portable zip (macOS)
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: SuMark-portable-macos.zip

      # Create portable zip for Windows
      - name: Create portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "SuMark.exe" | Where-Object { $_.DirectoryName -like "*release*" -and $_.DirectoryName -notlike "*deps*" } | Select-Object -First 1
          if ($exe) {
            Compress-Archive -Path $exe.FullName -DestinationPath "SuMark-portable-windows.zip"
          }

      - name: Upload portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: SuMark-portable-windows.zip
