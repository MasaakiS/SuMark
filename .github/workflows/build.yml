name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_NODE_VERSION: 24.11.1
  CI_NPM_VERSION: 11.16.0

jobs:
  # リリースを先に1つだけ作成するジョブ
  create_release:
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract changelog for release
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting changelog for version: ${VERSION}"
          awk "/^## \[v${VERSION}\]/{found=1; next} /^## \[v/{if(found) exit} found" CHANGELOG.md > /tmp/changelog_body.txt
          {
            echo "body<<CHANGELOG_DELIM_EOF"
            cat /tmp/changelog_body.txt
            echo "CHANGELOG_DELIM_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/release_body.md <<EOF
          ## Changes

          ${{ steps.changelog.outputs.body }}

          ## Downloads

          ### Installer (recommended)
          | OS | File |
          |---|---|
          | macOS | `.dmg` |
          | Windows | `.msi` |
          | Linux / Chromebook (x86_64) | `.deb` |
          | Linux / Chromebook (ARM64) | `.deb` (arm64) |

          ### Portable (no install required)
          | OS | File |
          |---|---|
          | macOS | `SuMark-portable-macos-${GITHUB_REF_NAME}.zip` |
          | Windows | `SuMark-portable-windows-${GITHUB_REF_NAME}.zip` |
          | Linux / Chromebook (x86_64) | `SuMark-linux-x86_64-${GITHUB_REF_NAME}.AppImage` |
          EOF

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SuMark $GITHUB_REF_NAME" \
              --notes-file /tmp/release_body.md \
              --draft
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SuMark $GITHUB_REF_NAME" \
              --notes-file /tmp/release_body.md \
              --draft
          fi

  # macOS ビルド専用ジョブ（必要最小限）
  build_macos:
    needs: create_release
    runs-on: macos-latest
    name: Build (macOS)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.CI_NODE_VERSION }}

      - name: Pin npm version and verify supply-chain config
        shell: bash
        run: |
          npm install -g npm@${CI_NPM_VERSION}
          npm --version
          npm --version | grep '^11\.'
          npm config get min-release-age
          npm config get min-release-age | grep '^7$'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Tauri app (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SuMark ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: '--target universal-apple-darwin'

      - name: Create portable zip (macOS)
        run: |
          APP_PATH=$(find src-tauri/target -name "SuMark.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            ditto -c -k --sequesterRsrc "$APP_PATH" "SuMark-portable-macos-${{ github.ref_name }}.zip"
          fi

      - name: Upload portable zip (macOS)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "SuMark-portable-macos-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  # Linux / Windows 用のビルド
  build_others:
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux (x86_64)
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            name: Linux (ARM64)

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux dependencies (x86_64)
        if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            patchelf

      - name: Install ARM64 cross-compilation dependencies
        if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu
          sudo dpkg --add-architecture arm64
          sudo bash -c 'cat > /etc/apt/sources.list << EOF
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF'
          sudo apt-get update
          sudo apt-get install -y \
            libexpat1-dev:arm64 \
            libwebkit2gtk-4.0-dev:arm64 \
            libgtk-3-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 \
            libssl-dev:arm64 \
            libxdo-dev:arm64

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.CI_NODE_VERSION }}

      - name: Pin npm version and verify supply-chain config
        shell: bash
        run: |
          npm install -g npm@${CI_NPM_VERSION}
          npm --version
          npm --version | grep '^11\.'
          npm config get min-release-age
          npm config get min-release-age | grep '^7$'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Setup environment for ARM64 cross-compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=/" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Build Tauri app (Windows / Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SuMark ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '--target aarch64-unknown-linux-gnu --bundles deb' || format('--target {0}', matrix.target) }}

      - name: Create portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/${{ matrix.target }}/release"
          $exe = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File | Where-Object {
            $_.Name -notlike "*setup*"
          } | Select-Object -First 1
          if ($exe) {
            Write-Host "Found exe: $($exe.FullName)"
            Compress-Archive -Path $exe.FullName -DestinationPath "SuMark-portable-windows-${{ github.ref_name }}.zip"
          } else {
            Write-Host "No executable found for portable zip creation in $releaseDir."
            Exit 1
          }

      - name: Upload portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "SuMark-portable-windows-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload AppImage (Linux)
        if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          APPIMAGE=$(find src-tauri/target -name "*.AppImage" -type f | head -1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" "SuMark-linux-x86_64-${{ github.ref_name }}.AppImage"
          fi

      - name: Upload AppImage artifact (Linux)
        if: matrix.platform == 'ubuntu-22.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "SuMark-linux-x86_64-${GITHUB_REF_NAME}.AppImage" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
